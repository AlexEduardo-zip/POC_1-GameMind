# Executáveis do GameMind para Windows e Linux. Uma tag v* (ex.: v0.1.0-beta) compila os dois, roda os testes antes e publica
# a release com os pacotes (pré-lançamento quando a tag tem "beta"). No main e à mão (workflow_dispatch) só testa e compila.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]      # no main só testa e compila (os pacotes ficam nos artefatos da execução)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sistema: windows-x64
          - os: ubuntu-22.04
            sistema: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"     # no Windows, a saída redirecionada para arquivo seria cp1252 e quebraria com acentos e símbolos
      VERSAO: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller pyflakes

      - name: Testes
        shell: bash
        run: |
          # se falhar, o fim do log vira uma anotação de erro (visível no resumo da execução, sem abrir o log)
          if ! python -m unittest discover -s tests > testes.log 2>&1 || ! python -m pyflakes src/gamemind src/extracao tests >> testes.log 2>&1; then
            cat testes.log
            python -c "import sys; t = open('testes.log', encoding='utf-8', errors='replace').read()[-6000:]; print('::error title=Testes::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
            exit 1
          fi
          tail -3 testes.log

      - name: Ícone
        run: python empacotamento/gerar_icone.py

      - name: Executável
        run: pyinstaller --noconfirm --clean empacotamento/gamemind.spec

      - name: Pacote (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GameMind -DestinationPath "GameMind-$env:VERSAO-${{ matrix.sistema }}.zip"

      - name: Pacote (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "GameMind-$VERSAO-${{ matrix.sistema }}.tar.gz" -C dist GameMind

      - uses: actions/upload-artifact@v4
        with:
          name: GameMind-${{ matrix.sistema }}
          path: GameMind-*
          if-no-files-found: error

  publicar:
    needs: compilar
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: GameMind ${{ github.ref_name }}
          body_path: empacotamento/notas-da-versao.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: pacotes/*
